
services:
  db:
    image: pgvector/pgvector:pg17
    container_name: paper_aggregator_db
    restart: unless-stopped

    environment:
      POSTGRES_USER: ${DB_USER:-aggregator_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      POSTGRES_DB: ${DB_NAME:-research_db}

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:

  postgres_data:
